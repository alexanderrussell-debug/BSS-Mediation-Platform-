#####################################################################
# UMS - Usage Mediation System
# Production overrides: /opt/ums/conf/ums.properties
#####################################################################

ums.dataDir=./data
ums.archive.enabled=true

ums.ref.subscribers=./refdata/subscribers.csv
ums.ref.ratingZones=./refdata/rating_zones.csv
ums.ref.roamingPartners=./refdata/roaming_partners.csv

ums.schedule.cron=0 0/15 * * * ?
ums.scheduler.autoStart=true

ums.tariff.peakStart=8
ums.tariff.peakEnd=20

# drive-test / NOC test SIMs - never billed
ums.filter.testMsisdns=6590000001,6590000002,639170000001

# ---------------- streams ----------------
ums.streams=MSC_SG,MSC_ID,PGW_SG,SMSC_SG

stream.MSC_SG.type=MSC_BER
stream.MSC_SG.collector=LOCAL
stream.MSC_SG.filePattern=CDR_MSC.*\\.ber
stream.MSC_SG.timezone=Asia/Singapore
stream.MSC_SG.country=SG

# Indonesia: one stream for all ID MSCs (Jakarta + Makassar), collected over FTP in prod
stream.MSC_ID.type=MSC_BER
stream.MSC_ID.collector=LOCAL
stream.MSC_ID.filePattern=CDR_MSC.*\\.ber
stream.MSC_ID.timezone=Asia/Jakarta
stream.MSC_ID.country=ID
#stream.MSC_ID.collector=FTP
#stream.MSC_ID.ftp.host=10.62.10.21
#stream.MSC_ID.ftp.user=cdrpull
#stream.MSC_ID.ftp.password=Cdr#2014id
#stream.MSC_ID.ftp.remoteDir=/export/cdr/out

stream.PGW_SG.type=PGW_CSV
stream.PGW_SG.collector=LOCAL
stream.PGW_SG.filePattern=PGW_.*\\.csv
stream.PGW_SG.timezone=Asia/Singapore
stream.PGW_SG.country=SG

stream.SMSC_SG.type=SMSC_PIPE
stream.SMSC_SG.collector=LOCAL
stream.SMSC_SG.filePattern=SMSC_.*\\.txt
stream.SMSC_SG.timezone=Asia/Singapore
stream.SMSC_SG.country=SG
